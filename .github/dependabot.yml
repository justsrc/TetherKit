# Dependabot: keep GitHub Actions on the latest versions automatically.
#
# Repo convention: pin every external action to a full 40-character commit
# SHA, with the release tag in a trailing comment
# (actions/checkout@<sha> # v7.0.1). A mutable tag is a supply-chain
# liability: whoever controls the action's repository can repoint the tag at
# malicious code, and our workflows hold a deploy key that can write to the
# public Homebrew tap that users install from. Pinning to a SHA makes the
# reference immutable, which is what GitHub's own hardening guide calls the
# most secure option, and what the OpenSSF Scorecard Pinned-Dependencies
# check measures.
#
# The local reusable-workflow call (uses: ./.github/workflows/update-tap.yml)
# is deliberately left unpinned: it is a path inside this repository, so
# there is no third-party source to pin, and GitHub requires local
# references to stay as paths.
#
# Why Dependabot still matters with SHA pins: Dependabot resolves the
# pinned action's latest release and opens a PR that rewrites the SHA and
# the trailing comment. Watching upstream releases by hand leaks; Dependabot
# folds stale pins into one grouped PR per week, and merges are backstopped
# by the normal test suite. Major bumps like v7 -> v8 arrive in the same
# stream.
#
# The known cost of SHA pinning, stated plainly so nobody rediscovers it:
# Dependabot ALERTS are only generated for actions referenced with semantic
# versioning, not SHA versioning. So after this convention lands, a
# compromised release of a pinned action arrives as a version-update PR
# rather than as a security alert, and dependabot_security_updates will
# have nothing to open for the github-actions ecosystem. That is the
# intended trade: a version-update PR still lands the fix, and the
# alternative (a mutable tag) means a retagged release reaches this repo
# without any PR at all. The alerts channel that remains effective is
# CodeQL's workflow scanning, which reads the workflow files themselves.
#
# Groups: one group for the whole ecosystem, so a week with several stale
# pins is one PR to review rather than four.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
