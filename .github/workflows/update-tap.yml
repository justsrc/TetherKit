# Sync the new version to the Homebrew tap (justsrc/homebrew-tap).
#
# Why not `on: release: published`:
#   release.yml creates the Release with GITHUB_TOKEN, and events triggered by
#   GITHUB_TOKEN do not trigger other workflows (GitHub's anti-recursion
#   guard). A release-event hook would never fire.
#   So this workflow is workflow_call, invoked explicitly by release.yml.
#
# The tap update goes through a pull request, never a direct push to main:
#   The tap is what users `brew install` from, so its contents are the highest
#   value target in this pipeline. A direct push lands unreviewed. This
#   workflow therefore pushes a bump branch and opens a PR; the maintainer
#   merges it. The tap repo's own ruleset blocks direct pushes to main, so
#   the PR is the only path.
#
#   The release environment (declared on the job below) puts a human
#   checkpoint in front of even creating the branch, so a compromised
#   workflow cannot get a branch up without someone saying yes first.
#
# Credentials: two, because git and the API are different capabilities.
#   - HOMEBREW_TAP_DEPLOY_KEY: a write-scoped deploy key on the tap, used for
#     the git push of the bump branch. Git only; it cannot open a pull
#     request.
#   - HOMEBREW_TAP_TOKEN: a fine-grained token with pull-requests: write on
#     justsrc/homebrew-tap only, used for the PR creation. GITHUB_TOKEN
#     cannot cross repositories, which is why a token is needed at all.
#   Each credential is scoped to one repository and one capability, so a leak
#   of either exposes the tap and nothing else.

name: Update Homebrew Tap

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag to sync, e.g. v0.1.0"
        required: true
        type: string
    # Declared so release.yml's named secrets map validates: an undeclared
    # secret name fails a workflow_call at startup, with zero jobs and no logs.
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
      HOMEBREW_TAP_TOKEN:
        required: true
  # For manual re-syncs: after a broken tap or a failed automatic sync.
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to sync, e.g. v0.1.0"
        required: true
        type: string

# The tap push happens over the scoped deploy key and the PR over the scoped
# token, so the GITHUB_TOKEN this workflow holds needs no write access
# anywhere in this repo.
permissions:
  contents: read

jobs:
  update:
    name: Sync the formula to ${{ inputs.tag }}
    runs-on: macos-26
    # Bounds a hung audit or build instead of burning the runner's minutes.
    timeout-minutes: 30
    # The human checkpoint in front of the tap. The environment carries a
    # required-reviewer rule, so this job waits for a maintainer to approve
    # the deployment before it creates the bump branch.
    environment: release

    steps:
      - name: Compute the source tarball sha256
        id: src
        env:
          TAP_TAG: ${{ inputs.tag }}
        run: |
          # env passage, not direct expansion: workflow inputs must never be
          # interpolated into run: text.
          tag="$TAP_TAG"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          for i in 1 2 3 4 5; do
            if curl -fsSL "$url" -o src.tar.gz; then break; fi
            echo "attempt ${i}: source archive not fetched yet, retrying in 5s…"
            sleep 5
          done
          test -s src.tar.gz || { echo "::error::could not fetch the source archive ${url}"; exit 1; }
          {
            echo "url=${url}"
            echo "sha256=$(shasum -a 256 src.tar.gz | awk '{print $1}')"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          # env passage, not direct expansion: a secret expression must never
          # sit inside run: text.
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check out the tap
        run: git clone git@github.com:justsrc/homebrew-tap.git tap

      - name: "Preflight: verify the formulas exist"
        working-directory: tap
        run: |
          # A missing formula must stop everything before any rewrite starts,
          # with a clear message, instead of failing perl mid-loop.
          for f in Formula/tetherkit.rb Formula/tetherkit-cli.rb; do
            test -f "$f" || { echo "::error::$f is missing in justsrc/homebrew-tap"; exit 1; }
          done

      - name: Rewrite the formulas (tetherkit and tetherkit-cli)
        working-directory: tap
        env:
          FORMULA_URL: ${{ steps.src.outputs.url }}
          FORMULA_SHA256: ${{ steps.src.outputs.sha256 }}
        run: |
          # Both formulas share the same source tarball, so the url/sha256 are
          # rewritten together.
          # perl instead of sed -i: BSD and GNU sed disagree about -i
          # semantics, perl behaves the same on both.
          for f in Formula/tetherkit.rb Formula/tetherkit-cli.rb; do
            perl -pi -e 's|^  url ".*"|  url "$ENV{FORMULA_URL}"|' "$f"
            perl -pi -e 's|^  sha256 ".*"|  sha256 "$ENV{FORMULA_SHA256}"|' "$f"

            # Verify the rewrite really happened. When the regex misses, perl
            # silently changes nothing; without this check an unchanged
            # formula gets pushed while looking successful.
            grep -q "url \"$FORMULA_URL\"" "$f" \
              || { echo "::error::failed to rewrite the url in ${f}"; exit 1; }
            grep -q "sha256 \"$FORMULA_SHA256\"" "$f" \
              || { echo "::error::failed to rewrite the sha256 in ${f}"; exit 1; }
            ruby -c "$f"
          done

      # Prove the rewritten formulas actually work before pushing. brew install
      # verifies the sha256 against the tarball, which stops the "wrong
      # checksum" class of error before the push.
      - name: Verify both formulas install
        env:
          TAP_VERSION: ${{ steps.src.outputs.version }}
        run: |
          tap_dir="$(brew --repository)/Library/Taps/justsrc/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "${GITHUB_WORKSPACE}/tap" "$tap_dir"

          brew audit --strict --online justsrc/tap/tetherkit-cli
          brew audit --strict --online justsrc/tap/tetherkit

          brew install --build-from-source justsrc/tap/tetherkit-cli
          test "$(tetherkit-cli --version | head -1)" \
            = "TetherKit ${TAP_VERSION} (C++23, macOS 13.3+)"

          brew install --build-from-source justsrc/tap/tetherkit
          app="$(brew --prefix)/opt/tetherkit/TetherKit.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/TetherKit" --install-finder-alias

          brew uninstall tetherkit tetherkit-cli

      # A branch and a pull request, never a push to main. The tap is what
      # users install from, so its contents get a human read before they
      # reach anybody's machine.
      - name: Commit to a branch
        working-directory: tap
        env:
          TAP_TAG: ${{ inputs.tag }}
          TAP_VERSION: ${{ steps.src.outputs.version }}
          TAP_BRANCH: bump-tetherkit-${{ inputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula already at ${TAP_TAG}, nothing to do."
            exit 0
          fi
          # Branch first, then commit: the commit must land ON the branch. The
          # opposite order commits on the checked-out default branch and only
          # then creates the branch at that commit, which leaves the default
          # branch itself carrying the change in the local clone.
          #
          # The branch name carries the tag, so a re-run for the same version
          # lands on the same branch instead of stacking a second one.
          git checkout -b "${TAP_BRANCH}"
          git commit -am "tetherkit + tetherkit-cli ${TAP_VERSION}"
          # --force: a re-run for the same tag rewrites the same branch, and
          # the branch is this workflow's own scratch space. Nothing else
          # writes it.
          git push --force origin "${TAP_BRANCH}"
          echo "Bump branch ${TAP_BRANCH} pushed" >> "$GITHUB_STEP_SUMMARY"

      # Opening the PR is the API half, and it needs the scoped token: the
      # deploy key authorizes git pushes only.
      - name: Open the pull request
        env:
          TAP_TAG: ${{ inputs.tag }}
          TAP_VERSION: ${{ steps.src.outputs.version }}
          TAP_BRANCH: bump-tetherkit-${{ inputs.tag }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # env passage, not direct expansion: a secret expression must never
          # sit inside run: text.
          #
          # Re-running for a version that already has a PR would fail with
          # "a pull request for branch X already exists", so an open PR for
          # this branch is treated as success. The branch push above already
          # refreshed its content either way.
          if gh pr list --repo justsrc/homebrew-tap --head "${TAP_BRANCH}" \
               --state open --json number --jq '.[0].number' | grep -q .; then
            echo "A pull request for ${TAP_BRANCH} is already open; nothing to do."
            gh pr list --repo justsrc/homebrew-tap --head "${TAP_BRANCH}" \
              --state open --json url --jq '.[0].url' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr create --repo justsrc/homebrew-tap \
            --base main \
            --head "${TAP_BRANCH}" \
            --title "tetherkit + tetherkit-cli ${TAP_VERSION}" \
            --body "Automated tap bump for TetherKit ${TAP_TAG}.

          The formulas point at the ${TAP_TAG} source tarball; the sha256 was
          recomputed from that tarball and both formulas were installed from
          this branch before the push (brew install --build-from-source,
          with codesign --verify --deep --strict on the app).

          This PR needs a maintainer merge: the tap is what users install
          from, so its contents do not change without a human reading them."

          gh pr list --repo justsrc/homebrew-tap --head "${TAP_BRANCH}" \
            --state open --json url --jq '.[0].url' >> "$GITHUB_STEP_SUMMARY"
