# Release: pushing a stable v* tag issues a release automatically.
#
#   git tag -a v0.2.0 -m "Tethernet 0.2.0" && git push origin v0.2.0
#
# Pre-release tags (a hyphen marks the semver pre-release part, e.g.
# v0.2.0-rc.1) are excluded below and handled by pre-release.yml, which
# publishes a marked pre-release and never touches the Homebrew tap.
#
# This workflow builds and unit-tests on its own (ctest plus the GUI
# packaging), so a tag cut after a main-branch regression is still caught at
# release time. It deliberately does NOT run the whole matrix - no Swift
# tests, sanitizers, abi-check, or the macOS 13.3 floor - a tag can ship
# without those; they gate pushes, PRs, and the weekly cron in tests.yml.

name: Release

on:
  push:
    # Stable tags only. The exclusion is what keeps a pre-release tag
    # (v*-*: the hyphen is semver's pre-release marker) from starting this
    # workflow -- otherwise it would publish a stable Release AND bump the
    # tap. Hyphenated tags belong to pre-release.yml, so exactly one of the
    # two workflows runs per tag push.
    tags: ["v*", "!v*-*"]

# Creating the Release and uploading assets need write access.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag and CMakeLists' VERSION must agree, otherwise
      # `tethernet-cli --version` will not match the version on the Release /
      # Homebrew. Catch that before the release.
      - name: Verify the tag matches the CMakeLists VERSION
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          cmake_ver=$(grep -E '^[[:space:]]+VERSION[[:space:]]+[0-9]' CMakeLists.txt \
                      | head -1 | awk '{print $2}')
          echo "tag=${tag_ver}  CMakeLists.txt=${cmake_ver}"
          if [ "$tag_ver" != "$cmake_ver" ]; then
            echo "::error::tag (${tag_ver}) does not match CMakeLists.txt VERSION (${cmake_ver})"
            exit 1
          fi

      - name: Install libusb
        run: brew install libusb

      - name: Build and test
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTETHERNET_WARNINGS_AS_ERRORS=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ctest --test-dir build --output-on-failure

      - name: Build the GUI
        run: cmake --build build --target gui

      - name: Package the command-line binary
        id: pkg
        run: |
          name="tethernet-cli-${GITHUB_REF_NAME}-macos-arm64.tar.gz"
          cp THIRD_PARTY_NOTICES.md build/bin/
          tar -C build/bin -czf "$name" tethernet-cli THIRD_PARTY_NOTICES.md
          {
            echo "name=${name}"
            echo "sha256=$(shasum -a 256 "$name" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Package Tethernet.app
        id: app
        run: |
          name="Tethernet-${GITHUB_REF_NAME}-macos-arm64.zip"
          # ditto preserves the bundle structure and extended attributes; it is
          # the standard way to package a .app.
          ditto -c -k --keepParent dist/Tethernet.app "$name"
          {
            echo "name=${name}"
            echo "sha256=$(shasum -a 256 "$name" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      # This sha256 is the one the Homebrew formula needs; it goes straight
      # into the Release notes, so the tap update can copy and paste it
      # instead of recomputing it locally.
      - name: Compute the source tarball sha256
        id: src
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          # A freshly pushed tag can take a few seconds before GitHub generates
          # the archive; retry a few times.
          for i in 1 2 3 4 5; do
            if curl -fsSL "$url" -o src.tar.gz; then break; fi
            echo "attempt ${i}: source archive not fetched yet, retrying in 5s…"
            sleep 5
          done
          test -s src.tar.gz || { echo "::error::could not fetch the source archive ${url}"; exit 1; }
          echo "sha256=$(shasum -a 256 src.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # The quoted heredoc keeps the shell from expanding anything, and
      # nothing is interpolated into the script itself: the checksum values
      # and asset names travel as env and are appended with printf, so their
      # content is data, never shell text.
      - name: Assemble the release notes
        env:
          SRC_SHA256: ${{ steps.src.outputs.sha256 }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_SHA256: ${{ steps.pkg.outputs.sha256 }}
          APP_NAME: ${{ steps.app.outputs.name }}
          APP_SHA256: ${{ steps.app.outputs.sha256 }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          Homebrew is recommended (built from source, no Gatekeeper prompt):

          ```bash
          brew install justsrc/tap/tethernet           # GUI, Tethernet.app
          brew install justsrc/tap/tethernet-cli       # command-line tool
          ```

          After installing the GUI, `open "$(brew --prefix)/opt/tethernet/Tethernet.app"`. On first run, click "Install privileged components" and enter the admin password once; the first launch also creates the Finder alias automatically, after which Tethernet turns up in Spotlight.

          ## Command line

          ```bash
          tethernet-cli --list          # list recognized devices, no root needed
          sudo tethernet-cli            # start the driver, needs root
          ```

          ## Requirements

          - CLI: macOS 13.3+; GUI: macOS 14+ (all assets are arm64-only)
          - Runtime dependency libusb: `brew install libusb` (Homebrew pulls it in automatically)

          ## Downloadable assets

          All assets are **unsigned**, so Gatekeeper quarantines them after a browser download. Remove the quarantine manually to run them:

          ```bash
          xattr -d com.apple.quarantine tethernet-cli     # CLI
          xattr -dr com.apple.quarantine Tethernet.app    # GUI (recursive)
          ```

          If that bothers you, use the Homebrew route above or build from source; locally built artifacts do not carry the quarantine flag.

          ## Checksums

          | File | SHA-256 |
          |---|---|
          EOF
          {
            printf "| %s | \`%s\` |\n" "Source tarball (used by the Homebrew formula)" "${SRC_SHA256}"
            printf "| \`%s\` | \`%s\` |\n" "${PKG_NAME}" "${PKG_SHA256}"
            printf "| \`%s\` | \`%s\` |\n" "${APP_NAME}" "${APP_SHA256}"
          } >> notes.md

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          APP_NAME: ${{ steps.app.outputs.name }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Tethernet ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "${PKG_NAME}" \
            "${APP_NAME}"

  # After the Release is created, sync the Homebrew tap to the new version.
  #
  # A separate job rather than more steps above: a failed tap push must not
  # mark an already-published Release as failed, and a separate job can be
  # re-run on its own via workflow_dispatch.
  update-tap:
    needs: release
    uses: ./.github/workflows/update-tap.yml
    with:
      tag: ${{ github.ref_name }}
    # Narrow mapping instead of secrets: inherit: the callee needs exactly
    # one secret, and the caller's remaining secrets stay out of its scope.
    #
    # HOMEBREW_TAP_TOKEN is the fine-grained token scoped to
    # justsrc/homebrew-tap (contents:write for the branch push,
    # pull_requests:write for the PR). Declared in the callee's
    # workflow_call secrets block, so the name validates at startup.
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
